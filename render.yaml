# Blueprint de Render para probar el MVP gratis (sin CLI, sin tarjeta).
# En Render: New -> Blueprint -> conectar este repo -> rama con este archivo -> Apply.
#
# Limitaciones del free tier a tener en cuenta (solo para pruebas, no producción):
# - juntalo-api "duerme" tras 15 min sin tráfico; el primer request tras dormir
#   tarda ~30-50s en responder (incluye el primer /healthz).
# - El disco de juntalo-api es efímero: las imágenes de portada subidas se
#   pierden en cada redeploy o reinicio del servicio.
# - juntalo-db (Postgres free) se elimina automáticamente ~30 días después de
#   creada. Para seguir probando después, hay que recrearla y correr
#   `make migrate` de nuevo contra la nueva URL.

databases:
  - name: juntalo-db
    plan: free
    databaseName: juntalo
    user: juntalo

services:
  - type: web
    name: juntalo-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: juntalo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /tmp/juntalo-files
      - key: STORAGE_URL
        value: https://juntalo-api.onrender.com/files
      - key: FRONTEND_URL
        value: https://juntalo-web.onrender.com
      - key: SELF_URL
        value: https://juntalo-api.onrender.com
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: MOCK_PAYMENT_MODE
        value: deferred
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"

  - type: web
    name: juntalo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://juntalo-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
