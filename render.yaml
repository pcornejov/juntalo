# Blueprint de Render para probar el MVP gratis (sin CLI, sin tarjeta).
# En Render: New -> Blueprint -> conectar este repo -> rama con este archivo -> Apply.
#
# Limitaciones del free tier a tener en cuenta (solo para pruebas, no producción):
# - juntalo-api "duerme" tras 15 min sin tráfico; el primer request tras dormir
#   tarda ~30-50s en responder (incluye el primer /healthz).
# - juntalo-db (Postgres free) se elimina automáticamente ~30 días después de
#   creada. Para seguir probando después, hay que recrearla y correr
#   `make migrate` de nuevo contra la nueva URL.
#
# Storage de imágenes: si las 5 variables R2_* de abajo NO se completan en el
# dashboard, el server cae a guardar en STORAGE_DIR (disco del contenedor),
# que es efímero — las imágenes se pierden en cada redeploy o reinicio. Para
# que persistan de verdad hay que crear un bucket en Cloudflare R2 y cargar
# esas 5 variables a mano (nunca en este archivo, ver sync: false abajo).

databases:
  - name: juntalo-db
    plan: free
    databaseName: juntalo
    user: juntalo

services:
  - type: web
    name: juntalo-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: juntalo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /tmp/juntalo-files
      - key: STORAGE_URL
        value: https://juntalo-api.onrender.com/files
      - key: FRONTEND_URL
        value: https://juntalo-web.onrender.com
      - key: SELF_URL
        value: https://juntalo-api.onrender.com
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: MOCK_PAYMENT_MODE
        value: deferred
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      # EXPOSE_RESET_LINKS se deja en su default (false): aunque este es un
      # deploy de prueba, es una URL pública real con cuentas reales — si
      # se expusiera el token de "olvidé mi contraseña" en la respuesta de
      # la API, cualquiera podría secuestrar la cuenta de otra persona con
      # solo saber su email. Con RESEND_API_KEY configurada, el link ya
      # llega por email real y este atajo no hace falta.
      - key: RESEND_API_KEY
        sync: false # se completa a mano en el dashboard de Render — nunca en el repo
      - key: EMAIL_FROM
        value: onboarding@resend.dev # sandbox de Resend: solo entrega a tu propio email hasta verificar un dominio
      - key: SENTRY_DSN
        sync: false # se completa a mano — DSN del proyecto backend en Sentry
      # Storage persistente (Cloudflare R2) — ver nota arriba. Las 5 vienen
      # de: dashboard de Cloudflare > R2 > crear bucket > "Manage R2 API
      # Tokens" para las credenciales, y "Public access" del bucket (o un
      # dominio custom conectado) para R2_PUBLIC_URL. Si se dejan vacías,
      # cae a STORAGE_DIR (disco efímero) sin romper el deploy.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Captcha (Cloudflare Turnstile) en el registro — vacío = sin captcha,
      # no rompe el deploy (ver docs/deploy-render.md).
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Login con Google — vacío = la ruta /auth/google no se monta, no rompe
      # el deploy. Se crea en Google Cloud Console > APIs & Services >
      # Credentials > OAuth client ID (tipo "Web application"), con
      # juntalo-web.onrender.com como "Authorized JavaScript origin". El
      # Client ID no es un secreto (debe coincidir con VITE_GOOGLE_CLIENT_ID
      # en juntalo-web), pero igual se deja a mano por deploy.
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: juntalo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://juntalo-api.onrender.com/api/v1
      - key: VITE_SENTRY_DSN
        sync: false # se completa a mano — DSN del proyecto frontend en Sentry (puede ser el mismo proyecto u otro)
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false # site key del widget de Turnstile — es pública (no un secreto), pero igual se deja a mano por deploy
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false # mismo Client ID que GOOGLE_CLIENT_ID en juntalo-api — público, pero a mano por deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
