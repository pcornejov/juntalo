# Esqueleto de producción (Hito 5 lo completa: backups, monitoreo, checklist de seguridad).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: juntalo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: juntalo
    volumes:
      - juntalo_pg_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      target: prod
    environment:
      PORT: "8080"
      APP_ENV: production
      DATABASE_URL: postgres://juntalo:${POSTGRES_PASSWORD}@postgres:5432/juntalo?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      JUNTALO_DOMAIN: ${JUNTALO_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - juntalo_caddy_data:/data
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  juntalo_pg_data:
  juntalo_caddy_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
