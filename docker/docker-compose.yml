services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: juntalo
      POSTGRES_PASSWORD: juntalo
      POSTGRES_DB: juntalo
    ports:
      - "5432:5432"
    volumes:
      - juntalo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juntalo"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      target: dev
    working_dir: /app
    volumes:
      - ../backend:/app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: development
      DATABASE_URL: postgres://juntalo:juntalo@postgres:5432/juntalo?sslmode=disable
      JWT_SECRET: dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
    command: air

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  juntalo_pg_data:
